server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    # smaller downloads on slow mobile data (text files only; the API already sends pre-compressed question data)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # ── Health check for Koyeb (HTTP check path: /healthz) - answers 200 only when wapi is up ──
    location = /healthz {
        access_log         off;
        proxy_pass         http://127.0.0.1:8085/healthz;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
    }

    # ── wapi — सगळे routes /wapi/ खाली ─────────────────────
    location /wapi/ {
        client_max_body_size 60m;
        proxy_pass         http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        gzip                     off;
        chunked_transfer_encoding on;
        tcp_nodelay              on;
        # long-running /v1/chat/completions calls must never be cut off by nginx
        # while gunicorn is streaming SSE chunks or heartbeats.
        proxy_connect_timeout 3600s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # ── Direct /v1/* OpenAI-compatible routes (if client omits /wapi prefix) ──
    location /v1/ {
        client_max_body_size 60m;
        proxy_pass         http://127.0.0.1:8085/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        gzip                     off;
        chunked_transfer_encoding on;
        tcp_nodelay              on;
        proxy_connect_timeout 3600s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # ── wapi dashboard JS मध्ये /router/* hardcoded routes ──────────
    # ── code बदलायचा नाही म्हणून हे fixes nginx मध्येच ─────────────
    location /router/dashboard_data {
        proxy_pass         http://127.0.0.1:8085/dashboard_data;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /router/release_daily {
        proxy_pass         http://127.0.0.1:8085/release_daily;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;
    }

    # model block / unblock / list (custom time) - see wapi/smart_router.py model_block_api()
    location /router/model_block {
        proxy_pass         http://127.0.0.1:8085/model_block;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;
    }

    # add / edit / delete a model with its RPM + RPD (saved in the database) - see wapi/smart_router.py model_config_api()
    location /router/model_config {
        proxy_pass         http://127.0.0.1:8085/model_config$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;
    }

    # live model list from Google for the "Add model" drop-down
    location /router/model_available {
        proxy_pass         http://127.0.0.1:8085/model_available$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;
    }

    # test one / several / all models: works? + model type (text / image / audio / embedding) - wapi/smart_router.py model_test_api()
    location /router/model_test {
        proxy_pass         http://127.0.0.1:8085/model_test$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 300s;
    }

    location /router/test_keys {
        proxy_pass         http://127.0.0.1:8085/test_keys;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── web-to-api (WebAI-to-API): only /api/web/v1 goes to wapi (rest of /api stays on Node) ──
    location ^~ /api/web/v1 {
        client_max_body_size 60m;      # image/file uploads (default 1m -> HTTP 413); WebAI allows 8 files, 40 MiB total
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        gzip                     off;
        chunked_transfer_encoding on;
        tcp_nodelay              on;
        proxy_connect_timeout 3600s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # ── Admin: official answer key PDF upload (default 1m body limit would give HTTP 413) ─────
    location /api/admin/answer-key/upload {
        client_max_body_size 30m;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
    }

    # ── apiii — बाकी सगळं Node.js ला ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
        proxy_request_buffering off;
        gzip               off;
    }
}
