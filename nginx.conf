server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    # ── wapi — सगळे routes /wapi/ खाली ─────────────────────
    location /wapi/ {
        proxy_pass         http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── wapi dashboard JS मध्ये /router/dashboard_data hardcoded आहे ──
    # ── code बदलायचा नाही म्हणून हा fix nginx मध्येच ───────────────
    location /router/dashboard_data {
        proxy_pass         http://127.0.0.1:8085/dashboard_data;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── apiii — बाकी सगळं Node.js ला ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
