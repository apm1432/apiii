server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    # ── wapi — सगळे routes /wapi/ खाली ─────────────────────
    location /wapi/ {
        proxy_pass         http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        # long-running /v1/chat/completions calls (up to 120s per attempt,
        # multiple attempts) must never be cut off by nginx while gunicorn
        # is still working on them.
        proxy_connect_timeout 3600s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # ── wapi dashboard JS मध्ये /router/* hardcoded routes ──────────
    # ── code बदलायचा नाही म्हणून हे fixes nginx मध्येच ─────────────
    location /router/dashboard_data {
        proxy_pass         http://127.0.0.1:8085/dashboard_data;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /router/test_keys {
        proxy_pass         http://127.0.0.1:8085/test_keys;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── apiii — बाकी सगळं Node.js ला ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
