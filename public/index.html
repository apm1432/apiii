<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPSC PYQ Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- Auth Section -->
        <section id="auth-section" class="view-section active">
            <div class="auth-box">
                <h2>Welcome to MPSC PYQ</h2>
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="toggleAuth('login')">Login</button>
                    <button class="auth-tab" onclick="toggleAuth('register')">Register</button>
                </div>
                
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <form id="register-form" class="hidden">
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <div id="auth-message" class="message"></div>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="view-section">
            <header class="dash-header">
                <h2>Exam Dashboard</h2>
                <div class="user-controls">
                    <button class="btn btn-danger" onclick="logout()">Logout</button>
                </div>
            </header>
            
            <div class="exam-grid" id="exam-grid">
                <!-- Exam Cards will be injected here via JS -->
            </div>
        </section>

        <!-- Payment Section -->
        <section id="payment-section" class="view-section">
            <div class="payment-box">
                <h2>Premium Access Required</h2>
                <p>Get full access to all MPSC Previous Year Questions, detailed explanations, and progress tracking.</p>
                <div class="pricing-cards">
                    <div class="price-card">
                        <h3>1 Day Pass</h3>
                        <div class="price">₹12</div>
                        <button class="btn btn-primary" onclick="initiatePayment('1_day')">Pay ₹12</button>
                    </div>
                    <div class="price-card">
                        <h3>2 Years Access</h3>
                        <div class="price">₹100</div>
                        <button class="btn btn-primary" onclick="initiatePayment('2_years')">Pay ₹100</button>
                    </div>
                </div>
                <button class="btn" onclick="showSection('dashboard-section')">Back to Dashboard</button>
            </div>
        </section>

        <!-- Test Interface Section -->
        <section id="test-section" class="view-section">
            <header class="test-header">
                <div class="header-left">
                    <button class="btn btn-icon" onclick="showSection('dashboard-section')">← Back</button>
                    <nav id="breadcrumb-nav">
                        <span class="crumb" id="crumb-year">Year</span> >
                        <span class="crumb" id="crumb-exam">Exam</span> >
                        <span class="crumb active" id="crumb-subject">Subject</span>
                    </nav>
                </div>
                <div class="header-controls">
                    <div class="mode-toggle">
                        <button id="btn-quiz" class="btn active" onclick="switchMode('quiz')">Quiz</button>
                        <button id="btn-full" class="btn" onclick="switchMode('full')">Full Paper</button>
                    </div>
                </div>
            </header>

            <main id="main-content">
                <!-- Quiz Mode View -->
                <div id="quiz-view" class="view-mode active">
                    <div class="question-container" id="quiz-question-container">
                        <!-- Injected via JS -->
                    </div>
                    <div class="controls">
                        <button class="btn nav-btn" onclick="prevQuestion()">Previous</button>
                        <span id="quiz-progress-text">1 / 50</span>
                        <button class="btn nav-btn" onclick="nextQuestion()">Next</button>
                    </div>
                </div>

                <!-- Full Paper Mode View -->
        <div id="full-view" class="view-mode">
                    <div class="full-paper-layout">
                        <div class="questions-list" id="full-questions-list">
                            <!-- Injected via JS -->
                        </div>
                        <div class="jump-grid-container">
                            <h3>Jump to Question</h3>
                            <div class="jump-grid" id="jump-grid">
                                <!-- Injected via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </section>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="modal">
        <span class="close-modal" onclick="closeImageModal()">&times;</span>
        <div class="modal-content-wrapper">
            <img class="modal-content" id="modal-img" src="" alt="Original Question">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
