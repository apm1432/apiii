<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPSC Interactive Exam</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_append.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">MPSC Interactive</div>
        <div class="stats">
            <div class="stat-box">Overall: <span id="scoreVal">0 / 0</span> (Correct / Solved)</div>
            <div class="stat-box">Completion: <span id="progressVal">0%</span></div>
            <button id="themeToggle" class="btn" style="background: rgba(255,255,255,0.1); color: inherit;">☀️ Light</button>
            <button id="resetBtn" class="btn danger">Reset Progress</button>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Exam Filter</h3>
            <div id="examFilters" class="filter-list">
                <!-- Exam filters populated via JS -->
            </div>
            <h3>Overall Progress</h3>
            <div class="progress-bar-container">
                <div id="globalProgressBar" class="progress-bar"></div>
            </div>
        </aside>

        <main class="content">
            <div class="exam-header">
                <h2 id="currentExamTitle">Select an Exam</h2>
            </div>
            <div id="questionsContainer">
                <!-- Questions populated via JS -->
            </div>
        </main>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <!-- The external data JS file generated by our Python script -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
